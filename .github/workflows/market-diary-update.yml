name: Market Diary hourly update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update candidate pool
        run: node market-diary/scripts/update-candidates.mjs
      - name: Commit data if changed
        run: |
          if git diff --quiet -- market-diary/data/candidates.json; then
            echo "No candidate changes"
            exit 0
          fi
          git config user.name "market-diary-bot"
          git config user.email "market-diary-bot@users.noreply.github.com"
          git add market-diary/data/candidates.json
          git commit -m "data: refresh Market Diary candidates"
          git push
