<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="牛牛市场雷达 Market Diary - 每天先看懂市场，再选一条直接写。" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="牛牛市场雷达｜Market Diary" />
  <meta property="og:description" content="今天发生什么、哪条值得写、这篇怎么写。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://devi-y.github.io/market-diary/" />
  <link rel="canonical" href="https://devi-y.github.io/market-diary/" />
  <title>牛牛市场雷达｜Market Diary</title>
  <style>
    .static-review{max-width:760px;margin:54px auto;padding:0 24px 56px;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#202421}.static-review h1{font-size:34px;margin:8px 0 12px}.static-review p{font-size:15px;line-height:1.75;color:#59615c}.static-review .lead{font-size:18px;color:#202421}.static-review .flow{margin-top:24px;padding:16px;border:1px solid #e8ebe9;border-radius:14px;font-weight:700}.js-ready .static-review{display:none}@media(max-width:700px){.static-review{margin-top:28px;padding:0 16px 40px}.static-review h1{font-size:28px}}
  </style>
  <script>document.documentElement.classList.add('js-ready')</script>
  <link rel="stylesheet" href="./daily-use.css" />
</head>
<body>
  <section class="static-review" aria-label="Market Diary 静态说明">
    <small>财经内容工具</small>
    <h1>牛牛市场雷达｜Market Diary</h1>
    <p class="lead"><b>今天 → 选一条 → 写出来。</b></p>
    <p>打开先看今天最重要的3件事；每条只讲发生什么、影响谁、值不值得写。点“写这条”后直接进入标题、开头、文章逻辑、关键数据和一级信源。</p>
    <div class="flow">今日必看 → 写这条 → 这篇怎么写</div>
  </section>

  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="#radar" data-jump="radar" aria-label="返回今日">
        <div class="brand-mark">M</div>
        <div class="brand-copy"><strong>牛牛市场雷达</strong><span>Market Diary</span></div>
      </a>

      <nav id="nav" aria-label="主导航">
        <button data-page="radar" class="nav-item active" type="button"><span>●</span><b>今日</b></button>
        <button data-page="workbench" class="nav-item" type="button"><span>✦</span><b>选题</b></button>
      </nav>

      <div class="top-actions">
        <span id="updated-at" class="updated-at">正在加载</span>
        <button class="icon-btn personal-btn" data-jump="watchlist" type="button" aria-label="我的关注" title="我的关注">☆</button>
        <button id="refresh-btn" class="icon-btn" type="button" aria-label="刷新数据" title="刷新">↻</button>
      </div>
    </div>
  </header>

  <main class="main">
    <h1 id="page-title" class="sr-only">今日</h1>

    <section id="page-radar" class="page active">
      <div class="today-intro">
        <p id="today-date" class="date-line">今天</p>
        <h2>今天只看 <strong id="hero-count">—</strong> 件事</h2>
        <p>先看发生什么，再决定哪条值得写。</p>
        <span id="freshness-note" class="freshness-note"></span>
      </div>

      <div id="hero-opportunities" class="top-stories" aria-label="今日必看"></div>

      <details class="more-news">
        <summary><span>更多资讯</span><small id="more-count"></small></summary>
        <div id="more-headlines" class="compact-feed"></div>
        <div id="live-section" class="live-section" hidden>
          <div class="more-subhead"><b>最新发现</b><small>新出现的信息，先看原文</small></div>
          <div id="live-headlines" class="live-feed"></div>
        </div>
      </details>
    </section>

    <section id="page-detail" class="page">
      <button id="back-btn" class="back-link" type="button">← 返回</button>
      <div id="detail-container"></div>
    </section>

    <section id="page-workbench" class="page">
      <div class="page-heading">
        <h2>找下一篇</h2>
        <p>搜公司、人物或主题，找到后直接点进去写。</p>
      </div>

      <div class="search-box">
        <span>⌕</span>
        <input id="search-input" type="search" placeholder="搜公司、人物或主题" autocomplete="off" aria-label="搜索选题" />
      </div>
      <div id="idea-filters" class="idea-filters" aria-label="选题筛选"></div>

      <div class="section-title-row results-row">
        <h3>选题库</h3>
        <span id="idea-count" class="result-count"></span>
      </div>
      <div id="event-list" class="compact-feed"></div>
    </section>

    <section id="page-watchlist" class="page">
      <button class="back-link" data-jump="radar" type="button">← 返回今日</button>
      <div class="page-heading">
        <h2>我的关注</h2>
        <p>这里不是主流程，只用来告诉系统你平时关心什么。</p>
      </div>

      <div class="section-title-row">
        <h3>最近相关</h3>
        <span id="watch-match-count" class="result-count"></span>
      </div>
      <div id="watch-events" class="compact-feed"></div>

      <details class="watch-settings" open>
        <summary>管理关注</summary>
        <div class="watch-settings-body">
          <form id="watch-add-form" class="watch-add-form">
            <select id="watch-add-type" aria-label="关注类型">
              <option>股票</option><option>人物</option><option>机构</option><option>主题</option>
            </select>
            <input id="watch-add-input" type="text" placeholder="例如：TSLA、巴菲特、半导体" aria-label="关注内容" autocomplete="off" />
            <button type="submit">添加</button>
          </form>
          <div id="watch-groups" class="watch-groups"></div>
          <button id="reset-watchlist" class="secondary-btn" type="button">恢复示例</button>
        </div>
      </details>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
  <script src="./analytics.js"></script>
</body>
</html>
